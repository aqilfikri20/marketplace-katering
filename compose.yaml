services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:?Set DOCKER_DB_DATABASE in .env.docker}
      MYSQL_USER: ${DOCKER_DB_USERNAME:?Set DOCKER_DB_USERNAME in .env.docker}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Set DOCKER_DB_ROOT_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Ketring Yuk"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${DOCKER_APP_KEY:?Set DOCKER_APP_KEY in .env.docker}
      APP_URL: http://localhost:8081
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:?Set DOCKER_DB_DATABASE in .env.docker}
      DB_USERNAME: ${DOCKER_DB_USERNAME:?Set DOCKER_DB_USERNAME in .env.docker}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env.docker}
      CACHE_STORE: file
      SESSION_DRIVER: file
      FILESYSTEM_DISK: public
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - app_storage:/var/www/html/storage

volumes:
  mysql_data:
  app_storage: